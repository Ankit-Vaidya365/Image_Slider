<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankit_ImageSlider </title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>IMAGE SLIDER</h1>
        <div class="image-container" id="image_container">
            <div class="image">
                <img src="./assets/image1.webp" alt="Image 1">
                <div class="text">Koenigsegg</div>
            </div>
            <div class="image">
                <img src="./assets/image2.webp" alt="Image 2">
                <div class="text">Porche</div>
            </div>
            <div class="image">
                <img src="./assets/image3.webp" alt="Image 3">
                <div class="text">Lamborghini</div>
            </div>
            <div class="image">
                <img src="./assets/image4.webp" alt="Image 4">
                <div class="text">Ferrari</div>
            </div>
            <div class="image">
                <img src="./assets/image5.webp" alt="Image 5">
                <div class="text">McLaren</div>
            </div>
            <a class="prev" onclick="slide_change(-1)"><</a>
            <a class="next" onclick="slide_change(1)">></a>
        </div>
        <div class="dots">
            <span class="dot" onclick="current_slide(1)"></span>
            <span class="dot" onclick="current_slide(2)"></span>
            <span class="dot" onclick="current_slide(3)"></span>
            <span class="dot" onclick="current_slide(4)"></span>
            <span class="dot" onclick="current_slide(5)"></span>
        </div>
    <script src="./js/script.js"></script>
</body>
</html>
